<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V&I restaurant - Вхід</title>
    <link rel="stylesheet" href="./css/loginPage.css">
    <script src="./js/loginPage.js" defer></script>
</head>
<body>
    <div class="login-card">
        <div class="logo-section">
            <div class="logo-circle">
                <img src="./assets/icons/utensils-crossed.svg">
            </div>
            <h1>V&I restaurant</h1>
            <p>Панель керування</p>
        </div>

        <div id="errorMessage"></div>

        <form id="login-form" method="POST">
            <div class="form-group">
                <label for="login">Логін</label>
                <div class="input-wrapper">
                    <img src="./assets/icons/users-round.svg">
                    <input type="text" name="login" id="login" placeholder="Введіть логін" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="input-wrapper">
                    <img src="./assets/icons/key-round.svg">
                    <input type="password" name="password" id="password" placeholder="Введіть пароль" required>
                </div>
            </div>
            <button type="submit" class="submit-btn">Увійти</button>
        </form>
    </div>
</body>
</html>
